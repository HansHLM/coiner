[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coiner"
version = "0.1.0"
description = "Coin photo identification with source-grounded numismatic price lookup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.68,<3",
    "pillow>=10.4,<13",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
